# Pipeline configuration globals
# Falls back to environment variables if defined there

# Gmail Configurations
SCOPES:
  - "https://www.googleapis.com/auth/gmail.modify"
TOKEN_FILE: "token.json"
CREDENTIALS_FILE: "credentials.json"
PROCESSED_EMAILS_FILE: "processed_emails.json"

# Label used to quarantine spam-classified emails (moved out of "Newsletter")
NEWSLETTER_SPAM_LABEL: "newsletter-spam"
# Name of the curated-newsletter label (removed when quarantining spam)
NEWSLETTER_LABEL_NAME: "Newsletter"

# Scheduler Configurations
FETCH_INTERVAL_HOURS: 4

# Repository Configurations
POSTS_DIR: "_posts"
GITHUB_REPO: "vampcoder/daily-newsletters"

# LLM Gate Curation Configurations
ENABLE_LLM_CURATION: true
LLM_MODEL: "deepseek/deepseek-v4-flash"
LLM_API_BASE: "https://api.deepseek.com"
# Thinking level for DeepSeek: "disabled" | "low" (enabled with small budget) | "high" (full)
LLM_THINKING_LEVEL: "low"
LLM_THINKING_BUDGET_TOKENS: 512
MIN_RELEVANCE_SCORE: 6
